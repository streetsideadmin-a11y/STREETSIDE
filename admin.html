<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin | Streetside</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
<link rel="stylesheet" href="styles/tokens.css" />
<link rel="stylesheet" href="styles/base.css" />
<link rel="stylesheet" href="styles/components.css" />
<style>
  body { background: var(--color-bg); }
  .admin-wrap { max-width: 480px; margin: 0 auto; padding: var(--space-9) var(--space-5); }
  .admin-wrap.is-wide { max-width: 1100px; }
  .admin-logo { display: flex; justify-content: center; margin-bottom: var(--space-6); }
  .admin-logo img { height: 40px; }
  .admin-card {
    background: var(--white);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: var(--space-7);
  }
  .admin-card h1 { font-size: 1.4rem; margin-bottom: var(--space-2); }
  .admin-card p { color: var(--color-ink-muted); margin-bottom: var(--space-5); font-size: 0.95rem; }
  .admin-error {
    background: #fbeaea;
    color: var(--red-700);
    border: 1px solid var(--red-600);
    border-radius: var(--radius-sm);
    padding: var(--space-3) var(--space-4);
    font-size: 0.9rem;
    margin-bottom: var(--space-4);
    display: none;
  }
  .admin-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-6);
    flex-wrap: wrap;
    gap: var(--space-3);
  }
  .admin-header h1 { font-size: 1.5rem; margin: 0; }
  .admin-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: var(--space-4);
    margin-bottom: var(--space-7);
  }
  .admin-summary__card {
    background: var(--white);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: var(--space-4);
  }
  .admin-summary__card strong { display: block; font-size: 1.8rem; color: var(--color-brand-strong); }
  .admin-summary__card span { font-size: 0.82rem; color: var(--color-ink-muted); }
  .admin-table-wrap {
    background: var(--white);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    overflow-x: auto;
  }
  table.admin-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; white-space: nowrap; }
  table.admin-table th, table.admin-table td {
    text-align: left;
    padding: 10px 14px;
    border-bottom: 1px solid var(--color-border);
  }
  table.admin-table th { background: var(--off-white); font-weight: 700; position: sticky; top: 0; }
  table.admin-table tr:last-child td { border-bottom: none; }
  .admin-loading, .admin-empty { padding: var(--space-6); text-align: center; color: var(--color-ink-muted); }
  #admin-dashboard { display: none; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="admin-wrap" id="admin-login-view">
  <div class="admin-logo">
    <img src="images/streetside-logo-horizontal.png" alt="Streetside" />
  </div>
  <div class="admin-card">
    <h1>Admin Login</h1>
    <p>Sign in to view real signup data.</p>
    <div class="admin-error" id="admin-login-error"></div>
    <form id="admin-login-form">
      <div class="field">
        <label for="admin-password">Password</label>
        <input id="admin-password" name="password" type="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block" style="margin-top: var(--space-4);">Sign In</button>
    </form>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div class="admin-wrap is-wide" id="admin-dashboard">
  <div class="admin-header">
    <h1>Signups</h1>
    <button type="button" class="btn btn-outline-brand" id="admin-logout-btn">Log Out</button>
  </div>

  <div class="admin-summary" id="admin-summary"></div>

  <div class="admin-table-wrap">
    <div class="admin-loading" id="admin-table-loading">Loading…</div>
    <table class="admin-table" id="admin-table" style="display:none;">
      <thead>
        <tr>
          <th>Submitted</th>
          <th>Type</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Address</th>
          <th>City</th>
          <th>ZIP</th>
          <th>Package</th>
        </tr>
      </thead>
      <tbody id="admin-table-body"></tbody>
    </table>
  </div>
</div>

<script>
(function () {
  var loginView = document.getElementById("admin-login-view");
  var dashboard = document.getElementById("admin-dashboard");
  var loginForm = document.getElementById("admin-login-form");
  var loginError = document.getElementById("admin-login-error");
  var logoutBtn = document.getElementById("admin-logout-btn");

  function showError(msg) {
    loginError.textContent = msg;
    loginError.style.display = "block";
  }

  function packageLabel(id) {
    var labels = {
      curb: "Curb Service",
      full: "Full Service",
      "one-time": "One-Time Service",
      "not-sure": "Not sure yet",
    };
    return labels[id] || id || "—";
  }

  function formatDate(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str == null ? "" : String(str);
    return div.innerHTML;
  }

  async function loadDashboard() {
    loginView.style.display = "none";
    dashboard.style.display = "block";

    try {
      var res = await fetch("/api/admin-data", { credentials: "same-origin" });
      if (res.status === 401) {
        dashboard.style.display = "none";
        loginView.style.display = "block";
        return;
      }
      if (!res.ok) throw new Error("Failed to load (" + res.status + ")");
      var data = await res.json();

      var summaryEl = document.getElementById("admin-summary");
      var s = data.summary;
      var cards = [
        { label: "Total signups", value: s.total },
        { label: "Waitlist", value: s.waitlist },
        { label: "Address checks", value: s.addressCheck },
      ];
      Object.keys(s.byPackage).forEach(function (pkg) {
        cards.push({ label: packageLabel(pkg), value: s.byPackage[pkg] });
      });
      summaryEl.innerHTML = cards
        .map(function (c) {
          return (
            '<div class="admin-summary__card"><strong>' +
            c.value +
            "</strong><span>" +
            escapeHtml(c.label) +
            "</span></div>"
          );
        })
        .join("");

      var tbody = document.getElementById("admin-table-body");
      if (data.signups.length === 0) {
        document.getElementById("admin-table-loading").textContent = "No signups yet.";
      } else {
        tbody.innerHTML = data.signups
          .map(function (row) {
            var name = [row.first_name, row.last_name].filter(Boolean).join(" ") || "—";
            return (
              "<tr>" +
              "<td>" + formatDate(row.submitted_at) + "</td>" +
              "<td>" + escapeHtml(row.form_type) + "</td>" +
              "<td>" + escapeHtml(name) + "</td>" +
              "<td>" + escapeHtml(row.email || "—") + "</td>" +
              "<td>" + escapeHtml(row.phone || "—") + "</td>" +
              "<td>" + escapeHtml(row.street_address || "—") + "</td>" +
              "<td>" + escapeHtml(row.city || "—") + "</td>" +
              "<td>" + escapeHtml(row.zip || "—") + "</td>" +
              "<td>" + escapeHtml(packageLabel(row.interested_package)) + "</td>" +
              "</tr>"
            );
          })
          .join("");
        document.getElementById("admin-table-loading").style.display = "none";
        document.getElementById("admin-table").style.display = "table";
      }
    } catch (err) {
      console.error("[streetside] Admin dashboard load failed:", err);
      document.getElementById("admin-table-loading").textContent =
        "Couldn't load data — try refreshing the page.";
    }
  }

  loginForm.addEventListener("submit", async function (e) {
    e.preventDefault();
    loginError.style.display = "none";
    var password = document.getElementById("admin-password").value;

    try {
      var res = await fetch("/api/admin-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ password: password }),
      });
      if (!res.ok) {
        var data = await res.json().catch(function () {
          return {};
        });
        showError(data.error || "Sign in failed — try again.");
        return;
      }
      loginForm.reset();
      loadDashboard();
    } catch (err) {
      showError("Something went wrong — check your connection and try again.");
    }
  });

  logoutBtn.addEventListener("click", async function () {
    try {
      await fetch("/api/admin-logout", { method: "POST", credentials: "same-origin" });
    } catch (err) {
      // Ignore — we're clearing the local view either way.
    }
    dashboard.style.display = "none";
    loginView.style.display = "block";
  });

  // If a valid session cookie already exists (e.g. page refresh),
  // this quietly loads the dashboard instead of showing the login
  // form again. If it's expired or missing, admin-data.js returns
  // 401 and loadDashboard() falls back to the login view.
  (async function checkExistingSession() {
    try {
      var res = await fetch("/api/admin-data", { credentials: "same-origin" });
      if (res.ok) loadDashboard();
    } catch (err) {
      // Stay on the login view.
    }
  })();
})();
</script>
</body>
</html>
